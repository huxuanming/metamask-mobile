name: Android Standalone Test APK (Fork)

on:
  push:
    branches: ['codex/android-debug-build']
    paths: ['.github/workflows/android-dev-fork.yml']
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch or ref to build'
        required: true
        default: 'codex/android-debug-build'
        type: string

permissions:
  contents: read

env:
  METAMASK_BUILD_TYPE: main
  METAMASK_ENVIRONMENT: dev
  CONFIGURATION: Release
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'
  CI: 'true'
  # Public test build: do not embed credentials in public artifacts.
  MM_INFURA_PROJECT_ID: 'null'
  WALLET_CONNECT_PROJECT_ID: ''
  MM_FOX_CODE: 'EXAMPLE_FOX_CODE'

jobs:
  build-android:
    name: Build MetaMask Android standalone test APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      - name: Enable Yarn 4
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.14.1 --activate
          node --version
          yarn --version

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Prepare MetaMask build dependencies
        env:
          METAMASK_BUILD_TYPE: main
        run: yarn setup:github-ci

      - name: Configure test environment
        env:
          GOOGLE_SERVICES_B64_ANDROID: ''
          MM_INFURA_PROJECT_ID: 'null'
          WALLET_CONNECT_PROJECT_ID: ''
          MM_FOX_CODE: 'EXAMPLE_FOX_CODE'
        shell: bash
        run: |
          # Keep credentials out of the repository. If no Firebase secret is configured,
          # use the repository's non-production example config so the debug APK can build.
          if [ -n "$GOOGLE_SERVICES_B64_ANDROID" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64_ANDROID" | base64 --decode > android/app/google-services.json
          else
            cp android/app/google-services-example.json android/app/google-services.json
          fi

          cat > .js.env <<EOF_ENV
          export MM_INFURA_PROJECT_ID="$MM_INFURA_PROJECT_ID"
          export WALLET_CONNECT_PROJECT_ID="$WALLET_CONNECT_PROJECT_ID"
          export MM_FOX_CODE="$MM_FOX_CODE"
          export METAMASK_BUILD_TYPE="main"
          export METAMASK_ENVIRONMENT="dev"
          export SENTRY_DISABLE_AUTO_UPLOAD="true"
          export GOOGLE_SERVICES_B64_ANDROID="$(base64 -w 0 android/app/google-services.json)"
          EOF_ENV

      - name: Use the standard Android debug keystore
        shell: bash
        run: |
          # The upstream dev flavor points at MetaMask's private signer. For a fork,
          # use the standard Android debug key so the APK is installable locally.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          old = 'signingConfig signingConfigs.mainDev'
          new = 'signingConfig signingConfigs.debug'
          if old not in text:
              raise SystemExit('Expected mainDev signing config was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          test -f android/keystores/debug.keystore

      - name: Build Android standalone test APK
        run: ./scripts/build.sh android main dev
        env:
          METAMASK_BUILD_TYPE: main
          METAMASK_ENVIRONMENT: dev
          CONFIGURATION: Release
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_OPTIONS: --max-old-space-size=8192
          METRO_MAX_WORKERS: '2'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metamask-android-standalone-fork
          path: |
            android/app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamask-android-standalone-fork-diagnostics
          path: |
            android/app/build/outputs/logs/**
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
